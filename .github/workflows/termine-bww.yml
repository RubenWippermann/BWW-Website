# BWW Termin-Rebuild — täglicher CI-Lauf.
# Liegt auf `main` (Default-Branch, nur von dort laufen geplante Workflows). Diese Datei liest/schreibt
# KEINEN Code der Next.js-App im selben Branch — sie backt nur Termine in die statische gh-pages-Seite.
# EIN Repo -> eingebauter GITHUB_TOKEN mit contents:write reicht; KEIN Secret, KEIN Token-Ablauf.
name: BWW Termine aktualisieren

on:
  schedule:
    - cron: "20 4 * * *"          # 04:20 UTC = 06:20 CEST, vor dem Bürotag
  workflow_dispatch:
  push:
    branches: [main]
    paths:                        # löst den ERSTEN Lauf aus + zeigt, ob Actions an ist
      - "tools/gen_event_jsonld.py"
      - ".github/workflows/termine-bww.yml"

permissions:
  contents: write                 # GITHUB_TOKEN darf gh-pages im EIGENEN Repo pushen

concurrency:
  group: bww-termine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tooling auschecken (main)
        uses: actions/checkout@v4          # default = main: enthält tools/gen_event_jsonld.py

      - name: Live-Content auschecken (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site                        # das, was ausgeliefert wird; persist-credentials -> Push möglich

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # FRISCHE-GUARD sitzt IM Generator, VOR dem Schreiben: toter/leerer Feed -> exit 3
      # -> dieser Step failt -> Deploy-Step läuft nicht -> kein Push (letzter guter Stand bleibt).
      # PRERENDER=True (Rubens Freigabe 2026-09-05: CI-Weg-Nachweis erfüllt, 25 gruene
      # Scheduled-Laeufe seit 16.08.) -> Generator baut jetzt echt, Stempel wird geschrieben.
      - name: Termine backen (Worbis-Buchungsseite, mit Frischestempel)
        env:
          BWW_PRERENDER: "1"
        run: python3 tools/gen_event_jsonld.py site/kurse/offene-kurse-worbis/index.html --write --stamp site/termine-stand.txt

      # Scope-Erweiterung (Rubens Freigabe 2026-09-15): dieselbe Auszeichnung zusaetzlich in
      # Startseite + Kursuebersicht backen, dort zeigt der Live-Terminkalender im Roh-HTML
      # bisher nur "Termine werden geladen..." (KI-/Crawler-unsichtbar). Kein eigener Stempel
      # noetig, der Worbis-Lauf druebter deckt die Frischewache fuer den ganzen Job ab.
      - name: Termine backen (Startseite)
        env:
          BWW_PRERENDER: "1"
        run: python3 tools/gen_event_jsonld.py site/index.html --write

      - name: Termine backen (Kursuebersicht)
        env:
          BWW_PRERENDER: "1"
        run: python3 tools/gen_event_jsonld.py site/kurse/index.html --write

      - name: Deploy nach gh-pages (nur bei Änderung)
        run: |
          cd site
          git config user.name  "BWW Termin-Automatik"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "unveraendert — kein Push"; exit 0; fi
          git commit -m "Termine automatisch aktualisiert ($(date -u +%F))"
          git push origin HEAD:gh-pages
